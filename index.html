<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Recordings</title>
  <meta name="description" content="Original songs, written and recorded at home." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grain"></div>

  <header class="site-header">
    <h1 class="wordmark">Lucas</h1>
    <p class="tagline">Songs written and recorded at home.</p>
  </header>

  <main>

    <!-- Now playing panel -->
    <section class="now-playing" aria-label="Now playing">
      <div class="np-top">
        <p class="np-eyebrow" id="np-status">Select a song to begin</p>
        <h2 class="np-title" id="np-title">Nothing playing</h2>
        <p class="np-note" id="np-note">&nbsp;</p>
      </div>

      <div class="transport">
        <button class="tbtn" id="btn-prev" aria-label="Previous song">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5v14M18 5l-10 7 10 7V5z" fill="currentColor"/></svg>
        </button>

        <button class="tbtn tbtn-play" id="btn-play" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>

        <button class="tbtn" id="btn-next" aria-label="Next song">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 5v14M6 5l10 7-10 7V5z" fill="currentColor"/></svg>
        </button>

        <span class="time time-current" id="time-current">0:00</span>

        <div class="scrubber" id="scrubber" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="scrubber-track"></div>
          <div class="scrubber-fill" id="scrubber-fill"></div>
          <div class="scrubber-handle" id="scrubber-handle"></div>
        </div>

        <span class="time time-total" id="time-total">0:00</span>
      </div>
    </section>

    <!-- Tracklist -->
    <section class="tracklist" aria-label="Tracklist">
      <ol id="track-list"></ol>
    </section>

  </main>

  <footer class="site-footer">
    <p>Recorded at home. <a href="mailto:you@example.com">Get in touch</a></p>
  </footer>

  <audio id="audio" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
